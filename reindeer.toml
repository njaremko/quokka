# Reindeer config: resolve third-party/Cargo.toml into Buck2 rules under
# third-party/. Crates are fetched at build time via `http_archive` (not
# vendored), matching nobie. Regenerate with `just regen-third-party`.
unresolved_fixup_error = true
third_party_dir = "third-party"
manifest_path = "third-party/Cargo.toml"
precise_srcs = false
license_patterns = ["LICENSE*", "COPYING*", "UNLICENSE*"]

# Platform target triples reindeer unions dep sets across. The names match
# prelude/rust/cargo_package.bzl's DEFAULT_REINDEER_PLATFORMS keys so the
# generated select() dispatch resolves without a PACKAGE-file override.
[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.macos-x86_64]
target = "x86_64-apple-darwin"

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
# @generated by `reindeer buckify`
# Do not edit by hand. See reindeer.toml for the regeneration commands.
"""
